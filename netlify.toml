[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  included_files = ["app/**", "app/templates/**", "app/static/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/api/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
